name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sql, mysql, mongo]
        # PHP 8.2 installs Laravel 12, PHP 8.3 the latest Laravel
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - run: shell/test-${{ matrix.suite }}.sh
        env:
          PHP_VERSION: ${{ matrix.php }}
