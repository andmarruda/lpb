name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sql, mysql, mongo]
    steps:
      - uses: actions/checkout@v4
      - run: shell/test-${{ matrix.suite }}.sh
